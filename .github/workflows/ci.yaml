---
name: PyYAML CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  go:
    name: build and test
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout PyYAML
      uses: actions/checkout@v7

    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27'

    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build ./...

    - name: Test
      run: go test ./...
